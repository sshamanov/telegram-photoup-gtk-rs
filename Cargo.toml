[package]
name = "photoup2"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
authors = ["sshamanov"]
license = "MIT"

[dependencies]
gtk4 = { version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", default-features = false, features = ["v1_5"] }
glib = "0.22"
gdk4 = "0.11"

grammers-client = "0.10"
grammers-session = { version = "0.10", features = ["sqlite-storage"] }
tokio = { version = "1", features = ["rt", "time", "net", "sync", "macros", "fs"] }

libraw-rs-sys = "0.0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
mozjpeg = "0.10"

toml = "0.9"
serde = { version = "1", features = ["derive"] }
dirs = "6"
log = "0.4"
env_logger = "0.11"
thiserror = "2"
kamadak-exif = "0.6"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
